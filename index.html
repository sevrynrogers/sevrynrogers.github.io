<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sevryn Rogers — Portfolio</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{--accent:#2b6cb0;--bg:#f7f7f5;--card:#fff;--text:#222;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;}
  header{background:var(--accent);color:#fff;padding:1.5rem 1rem;text-align:center;}
  header h1{margin:0;font-size:1.8rem;}
  header p{margin:.3rem 0 0;font-size:1rem;opacity:.95;}
  nav{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;background:#1a4e85;padding:.5rem;}
  nav a{color:#fff;text-decoration:none;font-size:.9rem;padding:.3rem .6rem;}
  nav a:hover{text-decoration:underline;}
  main{max-width:900px;margin:0 auto;padding:1rem;}
  section{margin:2rem 0;}
  h2{color:var(--accent);border-bottom:2px solid var(--accent);padding-bottom:.3rem;}
  .cards{display:flex;flex-wrap:wrap;gap:1rem;}
  .card{background:var(--card);border:1px solid #ddd;border-radius:8px;padding:1rem;flex:1 1 260px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .card h3{margin-top:0;}
  .details{display:none;margin-top:.7rem;font-size:.95rem;}
  .details.open{display:block;}
  .details dt{font-weight:bold;margin-top:.5rem;}
  .details dd{margin:.2rem 0 0;}
  #map{height:320px;width:100%;border-radius:8px;margin-top:1rem;}
  .resume-list{background:var(--card);border:1px solid #ddd;border-radius:8px;padding:1rem;}
  footer{text-align:center;padding:1rem;font-size:.85rem;color:#666;}
  a.contact-link{color:var(--accent);font-weight:bold;}
  .add{color:#b03030;
</html>
